<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثغور الأندلس - المحرك الاستراتيجي</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --gold-color: #f59e0b;
            --accent-green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg-dark); color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* الشريط العلوي للموارد */
        header { background: var(--panel-bg); padding: 8px 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .res-bar { display: flex; gap: 12px; font-size: 0.85rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); }
        .res-item span { color: var(--gold-color); }

        /* منطقة عرض اللعبة الرئيسية */
        #game-viewport { flex: 1; position: relative; overflow: hidden; background: #020617; }
        
        /* عرض القلعة (المباني) */
        .view-section { width: 100%; height: 100%; display: none; padding: 12px; overflow-y: auto; }
        .view-section.active { display: block; }
        
        .castle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
        .building-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: center; position: relative; }
        .building-icon { font-size: 2.2rem; margin-bottom: 6px; }
        .building-title { font-weight: bold; font-size: 0.95rem; color: var(--gold-color); }
        .building-lvl { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
        .btn-upgrade { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-upgrade:active { background: #1d4ed8; }

        /* عرض خريطة العالم والإحداثيات */
        .map-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px; background: #090d16; height: 100%; align-content: center; }
        .map-tile { background: #1a2332; border: 1px solid #2d3a4e; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1; font-size: 0.75rem; color: #64748b; cursor: pointer; }
        .map-tile.player-castle { border-color: var(--gold-color); background: #2e210d; color: var(--gold-color); font-weight: bold; }
        .map-tile.enemy-node { border-color: #ef4444; background: #2a1215; color: #f87171; }

        /* شريط التنقل السفلي */
        nav { background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; height: 56px; }
        .nav-btn { flex: 1; border: none; background: transparent; color: #94a3b8; font-weight: bold; font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
        .nav-btn.active { color: var(--gold-color); background: rgba(245, 158, 11, 0.05); border-top: 2px solid var(--gold-color); }
        .nav-icon { font-size: 1.2rem; }

        /* سجل الأحداث */
        .log-bar { background: #020617; border-top: 1px solid var(--border-color); padding: 6px 12px; font-size: 0.75rem; color: #38bdf8; height: 32px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <!-- الموارد -->
    <header>
        <div class="res-bar">
            <div class="res-item">🪙 <span id="res-gold">500</span></div>
            <div class="res-item">🌾 <span id="res-food">1000</span></div>
            <div class="res-item">⚔️ <span id="res-troops">100</span></div>
        </div>
        <div style="font-size: 0.8rem; color: #94a3b8;">إحداثيات: <b style="color:#fff;">[X:45, Y:88]</b></div>
    </header>

    <!-- منطقة العرض -->
    <div id="game-viewport">
        
        <!-- واجهة القلعة والمباني -->
        <div id="view-castle" class="view-section active">
            <h3 style="color: var(--gold-color); margin-bottom: 8px;">🏰 القلعة الرئيسية</h3>
            <div class="castle-grid">
                <div class="building-card">
                    <div class="building-icon">🏛️</div>
                    <div class="building-title">دار الإمارة</div>
                    <div class="building-lvl" id="lvl-townhall">المستوى 1</div>
                    <button class="btn-upgrade" onclick="upgradeBuilding('townhall', 100)">تطوير (100 ذهب)</button>
                </div>
                <div class="building-card">
                    <div class="building-icon">⚔️</div>
                    <div class="building-title">الثكنات العسكرية</div>
                    <div class="building-lvl" id="lvl-barracks">المستوى 1</div>
                    <button class="btn-upgrade" onclick="trainTroops()">تدريب 10 فرسان</button>
                </div>
                <div class="building-card">
                    <div class="building-icon">🌾</div>
                    <div class="building-title">المزارع</div>
                    <div class="building-lvl" id="lvl-farm">المستوى 1</div>
                    <button class="btn-upgrade" onclick="collectFood()">جمع الإمدادات</button>
                </div>
                <div class="building-card">
                    <div class="building-icon">🛡️</div>
                    <div class="building-title">الأسوار والأبراج</div>
                    <div class="building-lvl" id="lvl-wall">المستوى 1</div>
                    <button class="btn-upgrade" onclick="upgradeBuilding('wall', 150)">تقوية السور</button>
                </div>
            </div>
        </div>

        <!-- واجهة الخريطة والتضاريس -->
        <div id="view-map" class="view-section">
            <h3 style="color: var(--gold-color); margin-bottom: 8px;">🗺️ خريطة الثغور الأندلسية</h3>
            <div class="map-container" id="mapGrid">
                <!-- خريطة الإحداثيات تتولَّد برمجياً -->
            </div>
        </div>

    </div>

    <!-- سجل الأحداث السريع -->
    <div class="log-bar" id="logBox">> مرحباً بك يا قائد. القلعة تحت إمرتك.</div>

    <!-- شريط التنقل السفلي -->
    <nav>
        <button class="nav-btn active" id="btn-nav-castle" onclick="switchView('castle')">
            <span class="nav-icon">🏰</span>
            <span>القلعة</span>
        </button>
        <button class="nav-btn" id="btn-nav-map" onclick="switchView('map')">
            <span class="nav-icon">🗺️</span>
            <span>الخريطة</span>
        </button>
    </nav>

    <script>
        let state = {
            gold: parseInt(localStorage.getItem('andalus_gold')) || 500,
            food: parseInt(localStorage.getItem('andalus_food')) || 1000,
            troops: parseInt(localStorage.getItem('andalus_troops')) || 100,
            townhallLvl: parseInt(localStorage.getItem('andalus_th_lvl')) || 1
        };

        document.getElementById('lvl-townhall').innerText = `المستوى ${state.townhallLvl}`;

        function updateUI() {
            document.getElementById('res-gold').innerText = state.gold;
            document.getElementById('res-food').innerText = state.food;
            document.getElementById('res-troops').innerText = state.troops;
            localStorage.setItem('andalus_gold', state.gold);
            localStorage.setItem('andalus_food', state.food);
            localStorage.setItem('andalus_troops', state.troops);
            localStorage.setItem('andalus_th_lvl', state.townhallLvl);
        }

        function setLog(msg) {
            document.getElementById('logBox').innerText = `> ${msg}`;
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            if(viewName === 'castle') {
                document.getElementById('view-castle').classList.add('active');
                document.getElementById('btn-nav-castle').classList.add('active');
                setLog("أنت الآن داخل القلعة.");
            } else {
                document.getElementById('view-map').classList.add('active');
                document.getElementById('btn-nav-map').classList.add('active');
                setLog("أنت الآن تستعرض خريطة الثغور.");
            }
        }

        function upgradeBuilding(type, cost) {
            if(state.gold >= cost) {
                state.gold -= cost;
                if(type === 'townhall') {
                    state.townhallLvl++;
                    document.getElementById('lvl-townhall').innerText = `المستوى ${state.townhallLvl}`;
                    setLog("تم تطوير دار الإمارة بنجاح!");
                } else if(type === 'wall') {
                    setLog("تمت ترقية الأسوار والأبراج دفاعياً!");
                }
                updateUI();
            } else {
                setLog("الذهب غير كافٍ للتطوير!");
            }
        }

        function trainTroops() {
            if(state.food >= 100) {
                state.food -= 100;
                state.troops += 10;
                updateUI();
                setLog("تم تدريب 10 فرسان جدد بنجاح!");
            } else {
                setLog("الإمدادات غير كافية لتدريب الفرسان!");
            }
        }

        function collectFood() {
            state.food += 150;
            updateUI();
            setLog("تم جمع 150 وحدة إمدادات من المزارع.");
        }

        // توليد خريطة الإحداثيات الشبكية
        function renderMap() {
            const container = document.getElementById('mapGrid');
            container.innerHTML = '';
            for(let y = 1; y <= 5; y++) {
                for(let x = 1; x <= 5; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'map-tile';
                    
                    if(x === 3 && y === 3) {
                        tile.classList.add('player-castle');
                        tile.innerHTML = `🏰<br>قلعتك<br>45:88`;
                    } else if((x + y) % 3 === 0) {
                        tile.classList.add('enemy-node');
                        tile.innerHTML = `⚔️<br>معسكر<br>${42+x}:${85+y}`;
                        tile.onclick = () => setLog(`تم تحديد معسكر معادي عند الإحداثيات [${42+x}:${85+y}]`);
                    } else {
                        tile.innerHTML = `🌲<br>مورد<br>${42+x}:${85+y}`;
                        tile.onclick = () => setLog(`مورد طبيعي عند الإحداثيات [${42+x}:${85+y}]`);
                    }
                    container.appendChild(tile);
                }
            }
        }

        renderMap();
        updateUI();
    </script>
</body>
</html>
